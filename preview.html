<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>mobile preview</title>
<style>
  html,body{margin:0;background:#eceff3}
  body{padding:12px;display:flex;justify-content:center;align-items:flex-start}
  .frame{
    width:390px;height:1400px;
    transform:scale(.77);transform-origin:top center;
    border-radius:22px;overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.18);
    background:#fff;
  }
  iframe{width:390px;height:1400px;border:0;display:block;background:#fbfaf8}
</style>
</head>
<body>
  <div class="frame"><iframe src="./index.html" title="mobile preview"></iframe></div>
</body>
</html>
